<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF3C7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FEF3C7" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Stopwatch Outer Ring -->
    <linearGradient id="metalRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="50%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>

    <!-- Inner Dial Face -->
    <linearGradient id="dialFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF7ED"/>
    </linearGradient>

    <!-- Lightning Bolt Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>

    <!-- Speed Arc Gradient -->
    <linearGradient id="speedArc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="70%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>

    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#C2410C" flood-opacity="0.25"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="256" cy="270" r="220" fill="url(#bgGlow)"/>

  <!-- Energy Speed Lines -->
  <g stroke="#F59E0B" stroke-width="4" stroke-linecap="round" opacity="0.6">
    <line x1="80" y1="200" x2="40" y2="190" stroke-dasharray="8 6"/>
    <line x1="90" y1="290" x2="45" y2="310" stroke-dasharray="10 6"/>
    <line x1="432" y1="200" x2="472" y2="190" stroke-dasharray="8 6"/>
    <line x1="422" y1="290" x2="467" y2="310" stroke-dasharray="10 6"/>
    <line x1="140" y1="120" x2="110" y2="80" stroke-dasharray="6 6"/>
    <line x1="372" y1="120" x2="402" y2="80" stroke-dasharray="6 6"/>
  </g>

  <!-- Stopwatch Top Stem & Buttons -->
  <rect x="236" y="52" width="40" height="42" rx="10" fill="#EA580C"/>
  <rect x="220" y="34" width="72" height="26" rx="12" fill="#F97316"/>
  <rect x="340" y="82" width="30" height="22" rx="8" fill="#F97316" transform="rotate(32 355 93)"/>
  <rect x="142" y="82" width="30" height="22" rx="8" fill="#F97316" transform="rotate(-32 157 93)"/>

  <!-- Main Stopwatch Body -->
  <circle cx="256" cy="274" r="176" fill="url(#metalRing)" filter="url(#dropShadow)"/>
  <circle cx="256" cy="274" r="150" fill="#EA580C"/>
  <circle cx="256" cy="274" r="142" fill="url(#dialFace)"/>

  <!-- Speed Radial Track -->
  <circle cx="256" cy="274" r="122" fill="none" stroke="#FEE2E2" stroke-width="14"/>
  <circle cx="256" cy="274" r="122" fill="none" stroke="url(#speedArc)" stroke-width="14" stroke-dasharray="550" stroke-dashoffset="150" stroke-linecap="round"/>

  <!-- Dial Tick Marks -->
  <g stroke="#9CA3AF" stroke-width="3" stroke-linecap="round">
    <line x1="256" y1="164" x2="256" y2="176"/>
    <line x1="366" y1="274" x2="354" y2="274"/>
    <line x1="256" y1="384" x2="256" y2="372"/>
    <line x1="146" y1="274" x2="158" y2="274"/>
    <line x1="334" y1="196" x2="324" y2="204"/>
    <line x1="334" y1="352" x2="324" y2="344"/>
    <line x1="178" y1="196" x2="188" y2="204"/>
    <line x1="178" y1="352" x2="188" y2="344"/>
  </g>

  <!-- Big Central Lightning Bolt Symbol -->
  <g filter="url(#glow)">
    <polygon points="274,178 198,284 250,284 238,370 314,264 262,264" fill="url(#boltGrad)" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round"/>
  </g>

  <!-- Instant Reflex Digital Pill Badge -->
  <g transform="translate(181, 334)">
    <rect x="0" y="0" width="150" height="38" rx="19" fill="#202124" filter="url(#dropShadow)"/>
    <circle cx="20" cy="19" r="6" fill="#10B981"/>
    <text x="36" y="25" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" fill="#10B981" letter-spacing="1">180 MS</text>
  </g>

  <!-- Sparkle Stars -->
  <g fill="#FDE047">
    <path d="M 120 160 Q 120 175 105 175 Q 120 175 120 190 Q 120 175 135 175 Q 120 175 120 160 Z"/>
    <path d="M 390 150 Q 390 162 378 162 Q 390 162 390 174 Q 390 162 402 162 Q 390 162 390 150 Z"/>
    <path d="M 395 360 Q 395 370 385 370 Q 395 370 395 380 Q 395 370 405 370 Q 395 370 395 360 Z"/>
  </g>
</svg>
